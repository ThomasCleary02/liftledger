# Canonical Netlify config for the monorepo (repo root).
# Build the PWA in web/; do not set the site base directory to web/.
[build]
  command = "npm test && npm run build:web"
  publish = "web/.next"
  # Only rebuild if package.json files change (ignore doc-only updates)
  # Firebase Functions changes will NOT trigger Netlify builds
  ignore = "bash scripts/netlify-ignore.sh"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
