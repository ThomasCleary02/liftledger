# Canonical Netlify config for the monorepo (repo root).
# Build the PWA in web/; do not set the site base directory to web/.
[build]
  command = "npm test && npm run build:web"
  publish = "web/.next"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- package.json web/package.json packages/*/package.json"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
