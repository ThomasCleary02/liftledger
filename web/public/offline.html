<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14110e" />
    <title>Offline — LiftLedger</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #14110e;
        color: #f4ebe3;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: 100%;
        max-width: 22rem;
        border: 1px solid #3a322a;
        border-radius: 6px;
        padding: 1.5rem;
        background: #1c1915;
        box-shadow: 0 1px 0 rgb(125 186 138 / 0.14);
      }
      .kicker {
        font-family: ui-monospace, Menlo, monospace;
        font-size: 0.68rem;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #7dba8a;
      }
      h1 { margin: 0.4rem 0 0.75rem; font-size: 1.35rem; }
      p { margin: 0 0 1.25rem; color: #a3a3a3; line-height: 1.45; }
      button, a {
        display: block;
        width: 100%;
        min-height: 48px;
        border: 0;
        border-radius: 6px;
        background: #7dba8a;
        color: #101c16;
        font-weight: 600;
        font-size: 0.9rem;
        text-decoration: none;
        text-align: center;
        line-height: 48px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">The log</p>
      <h1>You are offline</h1>
      <p>LiftLedger needs a connection to open the ledger. Rejoin a network, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
